# AI HR Employee (Starter) on your own machine.
#
#   docker compose up --build
#
# then open http://localhost:8080 and sign in with the demo account in README.md.
# Two containers: the app (web + mailbox scheduler) and PostgreSQL. Nothing else to install.

services:
  app:
    build: .
    image: hr-starter:local
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    environment:
      APP_NAME: "AI HR Employee"
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: "http://localhost:${APP_PORT:-8080}"
      APP_KEY: "${APP_KEY:-}"            # empty: one is made on first start and kept in the files volume
      APP_LOCALE: ar
      APP_FALLBACK_LOCALE: en
      LOG_CHANNEL: stderr
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: starter
      DB_USERNAME: starter
      DB_PASSWORD: "${DB_PASSWORD:-starter-local}"
      SESSION_DRIVER: database
      CACHE_STORE: database
      QUEUE_CONNECTION: sync
      MAIL_MAILER: log
      SEED_DEMO: "true"
    volumes:
      - files:/var/www/html/storage/app/private
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: starter
      POSTGRES_USER: starter
      POSTGRES_PASSWORD: "${DB_PASSWORD:-starter-local}"
    # no ports: the database is reachable only from the app container
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U starter -d starter"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  pg-data:
  files:
