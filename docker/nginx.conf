server {
    listen 80 default_server;
    server_name _;
    root /var/www/html/public;
    index index.php;

    client_max_body_size 20m;
    server_tokens off;

    fastcgi_buffer_size 32k;
    fastcgi_buffers 16 16k;
    fastcgi_busy_buffers_size 64k;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        # Debian's fastcgi_params sends HTTP_HOST as $host, which drops the port: on
        # http://localhost:8080 every redirect then went to http://localhost/... and failed.
        fastcgi_param HTTP_HOST $http_host;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_read_timeout 300;
    }

    location /build/ {
        expires 30d;
        access_log off;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Applicant files never live under public/: they are served only through a
    # controller that checks the user's permission first.
    location ~ /\.(?!well-known) {
        deny all;
    }
}
